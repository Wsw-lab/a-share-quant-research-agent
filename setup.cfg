[metadata]
name = a-share-quant-research-agent
version = 0.1.0
description = Reproducible A-share research and backtesting prototype

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24
    pandas>=2.0

[options.packages.find]
where = src

[options.extras_require]
data =
    akshare
    tushare
