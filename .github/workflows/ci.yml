# actions/checkout v4 — pinned from the official refs/tags/v4 value verified 2026-08-24.
# actions/setup-python v5 — pinned from the official refs/tags/v5 value verified 2026-08-24.
{
  "name": "offline-research-verification",
  "on": ["push", "pull_request"],
  "permissions": {"contents": "read"},
  "env": {
    "PIP_DISABLE_PIP_VERSION_CHECK": "1",
    "PIP_NO_INPUT": "1",
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "offline-verification": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": {"python-version": ["3.10", "3.11", "3.12"]}
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {"python-version": "${{ matrix.python-version }}"}
        },
        {
          "name": "Install pinned packaging toolchain",
          "run": "python -m pip install --disable-pip-version-check --no-deps -r .github/ci-toolchain.txt"
        },
        {
          "name": "Verify packaging toolchain versions",
          "run": "python -c 'from importlib.metadata import version; expected={\"pip\":\"26.2.1\",\"setuptools\":\"84.0.0\",\"wheel\":\"0.48.0\",\"packaging\":\"26.3\"}; actual={name:version(name) for name in expected}; print(actual); assert actual == expected'"
        },
        {
          "name": "Install pinned runtime dependencies",
          "run": "python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps -r .github/ci-runtime.txt"
        },
        {
          "name": "Install package without dependency resolution",
          "run": "python -m pip install --no-index --no-deps --no-build-isolation -e ."
        },
        {
          "name": "Verify installed package import outside checkout",
          "working-directory": "${{ runner.temp }}",
          "run": "python -c 'from pathlib import Path; import a_share_quant_agent as package; module=Path(package.__file__).resolve(); assert Path.cwd().resolve() != module.parents[2]; print(module)'"
        },
        {
          "name": "Run public-surface contract",
          "env": {"AGENT_SKIP_README_GREEN_PATH_E2E": "1"},
          "run": "python -m unittest -v tests.test_public_surface_contract"
        },
        {
          "name": "Run complete offline unittest suite",
          "env": {"AGENT_SKIP_README_GREEN_PATH_E2E": "1"},
          "run": "python -m unittest discover -s tests -p 'test_*.py'"
        },
        {
          "name": "Run maintained public demo",
          "run": "python examples/run_demo.py"
        },
        {
          "name": "Run strict experiment twice and verify",
          "shell": "bash",
          "run": "set -euo pipefail\nAGENT_CI_RUN=\"$(mktemp -d)\"\necho \"AGENT_CI_RUN=$AGENT_CI_RUN\" >> \"$GITHUB_ENV\"\nAGENT_SHA=\"$(git rev-parse HEAD)\"\npython -m a_share_quant_agent.reproducible_experiment run --snapshot-dir tests/fixtures/qdata_research_snapshot_v1 --output-dir \"$AGENT_CI_RUN/first\" --qdata-sha 1111111111111111111111111111111111111111\npython -m a_share_quant_agent.reproducible_experiment run --snapshot-dir tests/fixtures/qdata_research_snapshot_v1 --output-dir \"$AGENT_CI_RUN/second\" --qdata-sha 1111111111111111111111111111111111111111\ndiff -r \"$AGENT_CI_RUN/first\" \"$AGENT_CI_RUN/second\"\npython -m a_share_quant_agent.reproducible_experiment verify --output-dir \"$AGENT_CI_RUN/first\" --expected-agent-sha \"$AGENT_SHA\" --expected-qdata-sha 1111111111111111111111111111111111111111\npython -c 'import json,sys; receipt=json.load(open(sys.argv[1], encoding=\"utf-8\")); assert receipt[\"snapshot\"][\"snapshot_id\"] == \"sha256:0b7a9697ceccc81cf74e131b74e9377c106160919da990910725011ad39c342b\"; assert receipt[\"repositories\"][\"qdata\"][\"provenance_verification\"] == \"unverified_fixture_repository_reference\"; assert receipt[\"verdict\"][\"status\"] == \"INSUFFICIENT_EVIDENCE\"' \"$AGENT_CI_RUN/first/receipt.json\""
        },
        {
          "name": "Prove receipt tamper rejection",
          "shell": "bash",
          "run": "set -euo pipefail\npython -c 'from pathlib import Path; import sys; path=Path(sys.argv[1]); payload=path.read_bytes(); changed=payload.replace(b\"fixture_arithmetic_only\", b\"fixture_arithmetic_onlz\", 1); assert len(changed) == len(payload) and changed != payload; path.write_bytes(changed)' \"$AGENT_CI_RUN/second/metrics.json\"\nset +e\npython -m a_share_quant_agent.reproducible_experiment verify --output-dir \"$AGENT_CI_RUN/second\"\nTAMPER_EXIT=$?\nset -e\ntest \"$TAMPER_EXIT\" -eq 2"
        },
        {
          "name": "Check repository diff",
          "shell": "bash",
          "run": "set -euo pipefail\ngit diff --check\ntest -z \"$(git status --short --untracked-files=all)\""
        }
      ]
    },
    "readme-green-path": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {"persist-credentials": false}
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {"python-version": "3.10"}
        },
        {
          "name": "Install pinned packaging toolchain",
          "run": "python -m pip install --disable-pip-version-check --no-deps -r .github/ci-toolchain.txt"
        },
        {
          "name": "Verify packaging toolchain versions",
          "run": "python -c 'from importlib.metadata import version; expected={\"pip\":\"26.2.1\",\"setuptools\":\"84.0.0\",\"wheel\":\"0.48.0\",\"packaging\":\"26.3\"}; actual={name:version(name) for name in expected}; print(actual); assert actual == expected'"
        },
        {
          "name": "Install pinned runtime dependencies",
          "run": "python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps -r .github/ci-runtime.txt"
        },
        {
          "name": "Install package without dependency resolution",
          "run": "python -m pip install --no-index --no-deps --no-build-isolation -e ."
        },
        {
          "name": "Run README green path end to end",
          "run": "python -m unittest -v tests.test_public_surface_contract.ReadmeContractTest.test_readme_green_path_runs_verbatim_in_a_clean_canonical_checkout"
        }
      ]
    }
  }
}
